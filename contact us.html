     <main> 
        <br><br>

        <!-- Contact Form -->
        <form id="contact-form" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="a8c0d125-443e-493e-82f3-cdc5fef72ace">
            <input type="hidden" id="visitor-time" name="visitor_time">
            <input type="hidden" id="visitor-os" name="OS">
            <input type="hidden" id="visitor-device" name="Device Type">
            <input type="hidden" id="visitor-ip" name="IP Address">
            <input type="hidden" id="visitor-location" name="Location">
            <div id="form-status" style="font-weight: bold; margin-bottom: 15px;"></div>

            <p>
                <label for="name">Your name:</label>
                <input 
                type="text" 
                id="name" 
                name="name" 
                placeholder="Enter your name"  
                minlength="2" 
                maxlength="80"
                pattern="^[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ '\-]*$"
                autocomplete="name"
                required>
            </p> 
            
            <p>
                <label for="email">Your email:</label>
                <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="example@email.com"
                maxlength="254"
                autocomplete="email"
                required>
            </p> 
            
            <p>
                <label for="message">Your message:</label>
                <textarea 
                id="message" 
                name="message" 
                rows="5"
                minlength="10"
                maxlength="2000"
                placeholder="Enter your message" 
                required></textarea>
            </p> 
            
            <p> 
                <input type="submit" id="submit-btn" value="Send Message"> 
            </p> 
        </form>  

        <hr style="width: 50%;">

        <!-- Supplier Info Box -->
        <div id="supplier-box">
            <h2>Supplier Inquiries</h2>
            <p>Interested in becoming a Spacebotics supplier?</p>
            <p>Please contact us directly at: <strong><a href="mailto:ST10501318@rcconnect.edu.za?subject=SupplierInquiry">ST10501318@rcconnect.edu.za</a></strong></p>
        </div>
    </main>
